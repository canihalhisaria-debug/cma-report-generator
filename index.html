<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA Projection Software</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>CMA Pro</h2>

<ul>

<li class="active">Dashboard</li>
<li>New CMA</li>
<li>Clients</li>
<li>Reports</li>
<li>Settings</li>

</ul>

</div>


<!-- MAIN AREA -->

<div class="main">

<div class="topbar">

<h1>CMA Projection Builder</h1>

<div class="top-buttons">

<button class="btn-outline">Save Draft</button>
<button class="btn-primary">Generate CMA</button>

</div>

</div>


<div class="grid">

<!-- LEFT PANEL -->

<div class="card">

<h3>Business Setup</h3>

<label>Business Type</label>
<select>
<option>New Business</option>
<option>Existing Business</option>
</select>

<label>Loan Type</label>
<select>
<option>CC</option>
<option>Term Loan</option>
<option>CC + Term Loan</option>
</select>

<label>Requirement</label>
<select>
<option>New CC</option>
<option>Enhancement</option>
<option>Renewal</option>
</select>

<label>Projection Starting FY</label>
<input type="text" value="FY 2025-26">

</div>


<div class="card">

<h3>Client Details</h3>

<label>Client Name</label>
<input type="text">

<label>Firm Name</label>
<input type="text">

<label>Constitution</label>
<select>
<option>Proprietorship</option>
<option>Partnership</option>
<option>LLP</option>
<option>Pvt Ltd</option>
</select>

<label>Industry</label>
<input type="text">

<label>Bank Name</label>
<input type="text">

<label>Branch</label>
<input type="text">

</div>

<!-- RIGHT PANEL -->

<div class="card preview">

<h3>Projection Preview</h3>

<div class="metric">
<span>Projected Sales</span>
<strong>₹45,00,000</strong>
</div>

<div class="metric">
<span>Net Profit</span>
<strong>₹3,80,000</strong>
</div>

<div class="metric">
<span>Current Ratio</span>
<strong class="green">1.45 ✓</strong>
</div>

<div class="metric">
<span>DSCR</span>
<strong class="green">1.68 ✓</strong>
</div>

</div>

</div>

</div>

</div>

</body>
</html>
