<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banker-Grade CMA Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Banker-Grade CMA Software Dashboard</h1>
      <p>Only two manual inputs are required: CC Amount and ROI. Everything else auto-calculates.</p>
    </header>

    <main>
      <section class="card">
        <h2>Dashboard Controls</h2>
        <div class="grid">
          <label>Actual Year Label <input id="actual-year" value="FY 2024-25" /></label>
          <label>Projection Years <input id="projection-years" type="number" min="2" max="10" value="5" /></label>
          <label>CC Amount <input id="cc-amount" type="number" value="10000000" /></label>
          <label>ROI (%) <input id="roi" type="number" value="11" step="0.1" /></label>
        </div>
        <div class="actions">
          <button id="run" class="primary">Generate CMA</button>
          <button id="download">Download Fixed Workbook</button>
        </div>
      </section>

      <section class="card">
        <h2>Generated Statements (Auto Projection)</h2>
        <div id="output"></div>
      </section>
    </main>
  </body>
</html>
